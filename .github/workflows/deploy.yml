name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/turant-bazaar"

      - name: Build and restart container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/turant-bazaar
            docker build -t turant-bazaar .
            docker stop turant-bazaar-app || true
            docker rm turant-bazaar-app || true
            docker run -d --name turant-bazaar-app \
              -p 8080:8080 \
              -e DB_SECRET_NAME=turantbazaar/db-creds \
              -e AWS_REGION=ap-south-1 \
              turant-bazaar
